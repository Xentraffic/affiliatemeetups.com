name: founding-agents-waitlist
on:
  push:
    paths: ['platform/waitlist/**', '.github/workflows/waitlist.yml']
  pull_request:
    paths: ['platform/waitlist/**', '.github/workflows/waitlist.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/waitlist/package-lock.json
      - run: npm ci
        working-directory: platform/waitlist
      - run: npm test
        working-directory: platform/waitlist
