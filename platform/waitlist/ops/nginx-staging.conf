# REVIEW ONLY. Include inside the existing HTTPS server block only after approval.
# Keep the staging waitlist on the same domain; no DNS change.
location ^~ /staging/founding-agents {
    proxy_pass http://127.0.0.1:3863;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /staging/api/founding-agents/ {
    proxy_pass http://127.0.0.1:3863;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
