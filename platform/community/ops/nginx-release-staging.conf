# Prepared only. Validate against current vhost; nginx -t before approved reload.
# DNS unchanged. All community staging traffic is isolated under /staging/.
location = /staging/community { proxy_pass http://127.0.0.1:3861; include proxy_params; }
location ^~ /staging/community/ { proxy_pass http://127.0.0.1:3861; include proxy_params; }
location ^~ /staging/api/community/ {
    proxy_pass http://127.0.0.1:3861;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /staging/mcp {
    proxy_pass http://127.0.0.1:3861;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}
location ~ ^/staging/(skill|round|heartbeat)\.md$ { proxy_pass http://127.0.0.1:3861; include proxy_params; }
