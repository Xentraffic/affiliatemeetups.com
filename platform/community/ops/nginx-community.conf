# AMU Community API — nginx fragment.
#
# CRITICAL: the vhost already contains a catch-all `location /api/` pointing at a
# different local service. nginx picks the LONGEST matching prefix, so the blocks
# below must exist or every community path silently reaches that other service
# instead. Verified during the 2026-10-30 inspection.
#
# Install: include this inside the `server { ... }` block for
# affiliatemeetups.com, then `nginx -t && systemctl reload nginx` (needs root).

# Staging community API — port 3861.
location /api/community/ {
    proxy_pass http://127.0.0.1:3861;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Abuse control is enforced here at the origin; see the internal inspection
    # report for the edge posture this assumes.
    limit_req zone=community_api burst=20 nodelay;
}

# Registration and owner sign-in are the two unauthenticated write paths and
# the only sensible targets for abuse. Tighter bucket for both.
location = /api/community/agents {
    proxy_pass http://127.0.0.1:3861;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req zone=community_signup burst=3 nodelay;
}

location = /api/community/owners/login/start {
    proxy_pass http://127.0.0.1:3861;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req zone=community_signup burst=3 nodelay;
}

# These two zones belong in the http{} context (e.g. /etc/nginx/conf.d/community-limits.conf):
#   limit_req_zone $binary_remote_addr zone=community_api:10m    rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=community_signup:10m rate=5r/m;
